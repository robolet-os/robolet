; robolet test firmware - ESP32-S3-N16R8 (16 MB flash, 8 MB octal PSRAM)
[platformio]
default_envs = s3

[env:s3]
platform = espressif32@6.13.0   ; pinned so that measurements can be reproduced
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  '-DPIO_PLATFORM_VERSION="6.13.0"'
  -DARDUINO_USB_CDC_ON_BOOT=1   ; console on both USB ports (chip USB and USB-UART), see DualConsole in main.cpp

; the Jarabot robot with an ESP32-S3 in place of its Raspberry Pi (src/config.h ROBOT_PRESET_JARABOT, docs/jarabot.md)
[env:jarabot]
extends = env:s3
build_flags =
  ${env:s3.build_flags}
  -DROBOT_PRESET_JARABOT=1
